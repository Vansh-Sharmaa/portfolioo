<script>
(function() {
  let isTransitioning = false;
  window.addEventListener('wheel', (e) => {
    // If resume modal is open, let user scroll the resume freely
    const resModal = document.getElementById('resume-modal');
    if (resModal && resModal.style.display !== 'none' && resModal.style.opacity !== '0') {
      return;
    }
    const app = window.application || window.app;
    if (!app || !app.camera) return;
    const current = app.camera.currentKeyframe;

    // If at DESK, IDLE, or LOADING and user scrolls DOWN:
    if (current !== 'monitor' && e.deltaY > 5) {
      if (!isTransitioning) {
        isTransitioning = true;
        app.camera.trigger('enterMonitor');
        setTimeout(() => { isTransitioning = false; }, 2000);
      }
      const ifr = document.querySelector('iframe');
      if (ifr && ifr.contentWindow) {
        ifr.contentWindow.postMessage({ type: 'forwardScroll', deltaY: e.deltaY }, '*');
      }
    } else if (current === 'monitor') {
      const ifr = document.querySelector('iframe');
      if (ifr && ifr.contentWindow) {
        ifr.contentWindow.postMessage({ type: 'forwardScroll', deltaY: e.deltaY }, '*');
      }
    }
  }, { passive: true });
})();
</script>

<script>
(function() {
  
  // Listen for openResume messages from child iframes (Retro OS CRT monitor)
  window.addEventListener('message', function(e) {
    if (e.data && (e.data.type === 'openResume' || e.data.type === 'viewResume')) {
      if (typeof window.openResumeModal === 'function') {
        window.openResumeModal();
      }
    }
  });

  
  // Stop wheel & touch propagation so outer scroll (Lenis / 3D room) never blocks modal scrolling
  const rvContainer = document.getElementById('resume-viewer-container');
  if (rvContainer) {
    rvContainer.addEventListener('wheel', function(e) {
      e.stopPropagation();
    }, { passive: false });
    rvContainer.addEventListener('touchmove', function(e) {
      e.stopPropagation();
    }, { passive: false });
  }

  window.openResumeModal = function() {
    const modal = document.getElementById('resume-modal');
    if (!modal) return;
    modal.style.display = 'block';
    // trigger reflow
    modal.offsetHeight;
    modal.style.opacity = '1';
    document.body.style.overflow = 'hidden';
  };

  window.closeResumeModal = function() {
    const modal = document.getElementById('resume-modal');
    if (!modal) return;
    modal.style.opacity = '0';
    setTimeout(() => {
      modal.style.display = 'none';
      document.body.style.overflow = '';
    }, 250);
  };

  // Close when clicking the dark backdrop
  document.addEventListener('click', function(e) {
    const modal = document.getElementById('resume-modal');
    if (modal && e.target === modal) {
      window.closeResumeModal();
    }
  });

  // Keyboard shortcut: R to open, ESC to close
  window.addEventListener('keydown', function(e) {
    const modal = document.getElementById('resume-modal');
    if (e.key === 'Escape') {
      if (modal && modal.style.display !== 'none' && modal.style.opacity !== '0') {
        e.stopPropagation();
        window.closeResumeModal();
      }
    } else if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
      if (activeTag !== 'input' && activeTag !== 'textarea') {
        if (!modal || modal.style.display === 'none' || modal.style.opacity === '0') {
          window.openResumeModal();
        } else {
          window.closeResumeModal();
        }
      }
    }
  });
})();
</script>
