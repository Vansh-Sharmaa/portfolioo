<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Electric Gaze ASCII/Dither Art — Preview (Phase 1)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090b0e;
      color: #e0e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      overflow-x: hidden;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
      max-width: 800px;
    }
    h1 {
      font-size: 26px;
      letter-spacing: 2px;
      color: #00ffcc;
      text-transform: uppercase;
      margin-bottom: 6px;
      text-shadow: 0 0 16px rgba(0,255,204,0.6);
    }
    p.subtitle {
      font-size: 13px;
      color: #8b9bb0;
      letter-spacing: 1px;
    }
    .badge {
      display: inline-block;
      background: rgba(0,255,204,0.15);
      color: #00ffcc;
      border: 1px solid #00ffcc;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      margin-top: 6px;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      align-items: flex-start;
      max-width: 1300px;
      width: 100%;
    }
    .canvas-card {
      background: #11151c;
      border: 1px solid #232b38;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6), 0 0 24px rgba(0,255,204,0.08);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .canvas-wrapper {
      position: relative;
      background: #05070a;
      border: 1px solid #1a2230;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }
    .controls {
      background: #11151c;
      border: 1px solid #232b38;
      border-radius: 12px;
      padding: 20px;
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      font-size: 13px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-group label {
      display: flex;
      justify-content: space-between;
      color: #a0b2c6;
      font-weight: 600;
    }
    .control-group label span.val {
      color: #00ffcc;
      font-family: monospace;
    }
    input[type=range] {
      accent-color: #00ffcc;
      height: 4px;
      background: #232b38;
      border-radius: 2px;
      cursor: pointer;
    }
    select, button {
      background: #1a2230;
      color: #e0e8f0;
      border: 1px solid #2c384c;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: all 0.2s;
    }
    select:hover, button:hover {
      border-color: #00ffcc;
      color: #00ffcc;
    }
    .btn-primary {
      background: #00ffcc;
      color: #05070a;
      border: none;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 16px rgba(0,255,204,0.4);
    }
    .btn-primary:hover {
      background: #ffffff;
      color: #000;
      box-shadow: 0 0 24px rgba(0,255,204,0.8);
    }
    .preset-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .status-bar {
      margin-top: 10px;
      font-size: 11px;
      color: #68798e;
      display: flex;
      justify-content: space-between;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h1>Electric Gaze — ASCII & Dither Engine</h1>
    <p class="subtitle">Phase 1 Preview • 21st.dev Architecture • Real-Time Shimmer Animation</p>
    <div class="badge">STATUS: PHASE 1 PREVIEW — AWAITING USER APPROVAL</div>
  </header>

  <div class="container">
    <div class="canvas-card">
      <div class="canvas-wrapper">
        <canvas id="viewCanvas" width="576" height="768"></canvas>
      </div>
      <div class="status-bar">
        <span id="fpsCounter">60.0 FPS</span>
        <span id="dimCounter">576 x 768 (Cell: 9px)</span>
        <span id="modeCounter">Mode: Dither (Shimmer Active)</span>
      </div>
    </div>

    <div class="controls">
      <h3 style="color:#00ffcc; letter-spacing:1px; font-size:14px; text-transform:uppercase;">Renderer Parameters</h3>

      <div class="control-group">
        <label>Palette / Color Theme</label>
        <select id="paletteSelect">
          <option value="electric_cyan">Electric Cyan (Phosphor CRT)</option>
          <option value="electric_white" selected>Electric Silver-White (21st.dev Ref)</option>
          <option value="matrix_green">Cyber Matrix Green</option>
          <option value="electric_blue">Cobalt Neon Blue</option>
          <option value="amber_crt">Amber CRT Vintage</option>
        </select>
      </div>

      <div class="control-group">
        <label>Render Mode</label>
        <select id="renderModeSelect">
          <option value="dither" selected>Dither (Ordered 8x8 Bayer)</option>
          <option value="characters">Characters (ASCII Density Glyphs)</option>
          <option value="dots">Dots (Halftone Stippling)</option>
          <option value="mosaic">Mosaic (Pixel Blocks)</option>
          <option value="cross">Cross (Pencil Cross-Hatch)</option>
        </select>
      </div>

      <div class="control-group">
        <label>Cell Size (px): <span class="val" id="cellSizeVal">9</span></label>
        <input type="range" id="cellSizeRange" min="4" max="18" value="9" step="1">
      </div>

      <div class="control-group">
        <label>Contrast: <span class="val" id="contrastVal">158</span></label>
        <input type="range" id="contrastRange" min="50" max="250" value="158" step="1">
      </div>

      <div class="control-group">
        <label>Density: <span class="val" id="densityVal">20</span></label>
        <input type="range" id="densityRange" min="0" max="60" value="20" step="1">
      </div>

      <div class="control-group">
        <label>Shimmer Intensity: <span class="val" id="animIntensityVal">60%</span></label>
        <input type="range" id="animIntensityRange" min="0" max="100" value="60" step="1">
      </div>

      <div class="control-group">
        <label>Shimmer Speed: <span class="val" id="animSpeedVal">100%</span></label>
        <input type="range" id="animSpeedRange" min="0" max="200" value="100" step="5">
      </div>

      <div class="control-group">
        <label>Post-FX</label>
        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:4px;">
          <label style="font-size:11px; font-weight:normal;"><input type="checkbox" id="scanlinesCheck" checked> Scanlines</label>
          <label style="font-size:11px; font-weight:normal;"><input type="checkbox" id="vignetteCheck" checked> Vignette</label>
          <label style="font-size:11px; font-weight:normal;"><input type="checkbox" id="bloomCheck" checked> Phosphor Glow</label>
        </div>
      </div>

      <div class="preset-btns">
        <button id="btnExactJSON">Reset to JSON</button>
        <button id="btnPauseAnim">Pause Animation</button>
      </div>

      <button class="btn-primary" id="btnExport">Export Hi-Res Snapshot</button>
    </div>
  </div>

    const sourceImg = new Image();

    const canvas = document.getElementById('viewCanvas');

    // Offscreen canvas for sampling
    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

    // Parameters
    let params = {
      cellSize: 9,
      contrast: 158,
      density: 20,
      renderMode: 'dither',
      animIntensity: 60,
      animSpeed: 100,
      palette: 'electric_white',
      scanlines: true,
      vignette: true,
      bloom: true,
      animated: true
    };

    const PALETTES = {
      electric_white: {
        bg: '#0a0b0d',
        high: '#ffffff',
        lit: '#d0dbed',
        mid: '#8da2c0',
        dim: '#2f3b4c',
        grid: '#181f2a'
      },
      electric_cyan: {
        bg: '#050c0e',
        high: '#e6ffff',
        lit: '#00ffcc',
        mid: '#00b894',
        dim: '#0e3d36',
        grid: '#0a2320'
      },
      matrix_green: {
        bg: '#020b04',
        high: '#d4ffd4',
        lit: '#00ff41',
        mid: '#008f11',
        dim: '#003b00',
        grid: '#002000'
      },
      electric_blue: {
        bg: '#060a14',
        high: '#edf2ff',
        lit: '#3ca6ff',
        mid: '#1d6cdb',
        dim: '#13284f',
        grid: '#0d1a33'
      },
      amber_crt: {
        bg: '#0e0a04',
        high: '#fff2d4',
        lit: '#ffb000',
        mid: '#cc7a00',
        dim: '#4a2d00',
        grid: '#2b1a00'
      }
    };

    // 8x8 Bayer matrix normalized [0, 1]
    const BAYER8 = [
      [ 0, 32,  8, 40,  2, 34, 10, 42],
      [48, 16, 56, 24, 50, 18, 58, 26],
      [12, 44,  4, 36, 14, 46,  6, 38],
      [60, 28, 52, 20, 62, 30, 54, 22],
      [ 3, 35, 11, 43,  1, 33,  9, 41],
      [51, 19, 59, 27, 49, 17, 57, 25],
      [15, 47,  7, 39, 13, 45,  5, 37],
      [63, 31, 55, 23, 61, 29, 53, 21]
    ].map(row => row.map(v => v / 64.0));

    // Preprocessed luminance grid cache
    let cachedCols = 0, cachedRows = 0;
    let baseLuminance = [];

    function updateSourceSampling() {
      if (!sourceImg.complete || !sourceImg.naturalWidth) return;

      const w = canvas.width;
      const h = canvas.height;
      offCanvas.width = w;
      offCanvas.height = h;

      // Draw and scale photo with proper aspect fit/fill
      const imgAspect = sourceImg.naturalWidth / sourceImg.naturalHeight;
      const canvasAspect = w / h;
      let drawW, drawH, drawX, drawY;

      if (imgAspect > canvasAspect) {
        drawH = h;
        drawW = h * imgAspect;
        drawX = (w - drawW) / 2;
        drawY = 0;
      } else {
        drawW = w;
        drawH = w / imgAspect;
        drawX = 0;
        drawY = (h - drawH) / 2;
      }

      offCtx.fillStyle = '#000000';
      offCtx.fillRect(0, 0, w, h);
      offCtx.drawImage(sourceImg, drawX, drawY, drawW, drawH);

      const imgData = offCtx.getImageData(0, 0, w, h);
      const data = imgData.data;

      const cs = params.cellSize;
      cachedCols = Math.floor(w / cs);
      cachedRows = Math.floor(h / cs);
      baseLuminance = new Float32Array(cachedCols * cachedRows);

      // Contrast factor formula
      const c = params.contrast;
      const cFactor = Math.pow((c + 100) / 100, 1.8);

      for (let r = 0; r < cachedRows; r++) {
        const y0 = r * cs;
        for (let col = 0; col < cachedCols; col++) {
          const x0 = col * cs;
          let sumLum = 0, count = 0;

          for (let dy = 0; dy < cs; dy += 2) {
            const py = y0 + dy;
            if (py >= h) break;
            const rowOffset = py * w * 4;
            for (let dx = 0; dx < cs; dx += 2) {
              const px = x0 + dx;
              if (px >= w) break;
              const idx = rowOffset + px * 4;
              // Rec. 709 luminance
              const lum = (data[idx] * 0.2126 + data[idx+1] * 0.7152 + data[idx+2] * 0.0722) / 255.0;
              sumLum += lum;
              count++;
            }
          }

          let rawLum = count > 0 ? sumLum / count : 0;
          // Apply normalized contrast enhancement
          let adj = (rawLum - 0.28) * cFactor + 0.28;
          baseLuminance[r * cachedCols + col] = Math.max(0.0, Math.min(1.0, adj));
        }
      }
    }

    sourceImg.onload = () => {
      updateSourceSampling();
      requestAnimationFrame(renderLoop);
    };

    let lastTime = performance.now();
    let frameCount = 0;
    let fpsTimer = 0;

    function renderLoop(now) {
      const dt = (now - lastTime) / 1000.0;
      lastTime = now;

      frameCount++;
      fpsTimer += dt;
      if (fpsTimer >= 0.5) {
        document.getElementById('fpsCounter').textContent = (frameCount / fpsTimer).toFixed(1) + ' FPS';
        frameCount = 0;
        fpsTimer = 0;
      }

      renderFrame(now / 1000.0);
      requestAnimationFrame(renderLoop);
    }

    function renderFrame(timeSec) {
      const w = canvas.width;
      const h = canvas.height;
      const cs = params.cellSize;
      const cols = cachedCols;
      const rows = cachedRows;
      const pal = PALETTES[params.palette] || PALETTES.electric_white;

      // 1. Clear with deep background
      ctx.fillStyle = pal.bg;
      ctx.fillRect(0, 0, w, h);

      if (!baseLuminance || baseLuminance.length === 0) return;

      // Shimmer time evolution
      const speed = (params.animSpeed / 100.0) * 3.2;
      const intensity = (params.animIntensity / 100.0) * 0.22;
      const animActive = params.animated;

      const asciiChars = " .:-=+*#%@";

      // 2. Render each cell
      for (let r = 0; r < rows; r++) {
        const y0 = r * cs;
        const yc = y0 + cs * 0.5;

        for (let c = 0; c < cols; c++) {
          const x0 = c * cs;
          const xc = x0 + cs * 0.5;

          const baseLum = baseLuminance[r * cols + c];
          if (baseLum <= 0.02) continue;

          // Shimmer wave
          let shimmer = 0;
          if (animActive) {
            shimmer = Math.sin(c * 0.38 + r * 0.26 + timeSec * speed * 2.2) * 0.5 +
                      Math.cos(c * 0.18 - r * 0.42 + timeSec * speed * 1.6) * 0.3 +
                      Math.sin((c + r) * 0.54 - timeSec * speed * 3.0) * 0.2;
          }

          const lum = Math.max(0.0, Math.min(1.0, baseLum + shimmer * intensity));
          const bayerThresh = BAYER8[r % 8][c % 8];
          const ditherDensity = 1.0 - (params.density - 20) * 0.012;
          const adjustedThresh = bayerThresh * ditherDensity;

          // Color selection
          let cellCol;
          if (lum > 0.82) cellCol = pal.high;
          else if (lum > 0.48) cellCol = pal.lit;
          else if (lum > 0.25) cellCol = pal.mid;
          else cellCol = pal.dim;

          ctx.fillStyle = cellCol;

          if (params.renderMode === 'dither') {
            // Bayer Dither Block
            if (lum >= adjustedThresh) {
              const pad = lum > 0.7 ? 1 : 1.5;
              ctx.fillRect(x0 + pad, y0 + pad, cs - pad * 2, cs - pad * 2);
            } else if (lum > 0.3) {
              // Micro dot for mid-tone density
              const dotSize = Math.max(1.2, cs * 0.3 * lum);
              ctx.fillRect(xc - dotSize * 0.5, yc - dotSize * 0.5, dotSize, dotSize);
            }
          } else if (params.renderMode === 'characters') {
            // ASCII glyph
            const charIdx = Math.floor(lum * (asciiChars.length - 1));
            const ch = asciiChars[charIdx];
            if (ch && ch !== ' ') {
              ctx.font = `bold ${cs}px monospace`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(ch, xc, yc);
            }
          } else if (params.renderMode === 'dots') {
            // Halftone circle
            const radius = (cs * 0.5 - 0.5) * Math.sqrt(lum);
            ctx.beginPath();
            ctx.arc(xc, yc, Math.max(0.8, radius), 0, Math.PI * 2);
            ctx.fill();
          } else if (params.renderMode === 'mosaic') {
            // Pixel block sized by luminance
            const pad = (1.0 - lum) * (cs * 0.45);
            ctx.fillRect(x0 + pad, y0 + pad, cs - pad * 2, cs - pad * 2);
          } else if (params.renderMode === 'cross') {
            // Pencil cross hatch
            ctx.strokeStyle = cellCol;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x0 + 1, y0 + 1);
            ctx.lineTo(x0 + cs - 1, y0 + cs - 1);
            if (lum > 0.5) {
              ctx.moveTo(x0 + cs - 1, y0 + 1);
              ctx.lineTo(x0 + 1, y0 + cs - 1);
            }
            ctx.stroke();
          }
        }
      }

      // 3. Post Effects: Scanlines
      if (params.scanlines) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        for (let y = 0; y < h; y += 3) {
          ctx.fillRect(0, y, w, 1);
        }
      }

      // 4. Post Effects: Vignette
      if (params.vignette) {
        const grad = ctx.createRadialGradient(w/2, h/2, w * 0.35, w/2, h/2, w * 0.75);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.7)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }

      // 5. Post Effects: Phosphor Bloom / Glow overlay
      if (params.bloom) {
        ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = pal.lit;
        ctx.globalAlpha = 0.06;
        ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = 1.0;
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    document.getElementById('densityRange').addEventListener('input', e => {
      params.density = parseInt(e.target.value);
      document.getElementById('densityVal').textContent = params.density;
    });
    document.getElementById('animIntensityRange').addEventListener('input', e => {
      params.animIntensity = parseInt(e.target.value);
      document.getElementById('animIntensityVal').textContent = params.animIntensity + '%';
    });
    document.getElementById('animSpeedRange').addEventListener('input', e => {
      params.animSpeed = parseInt(e.target.value);
      document.getElementById('animSpeedVal').textContent = params.animSpeed + '%';
    });
    document.getElementById('scanlinesCheck').addEventListener('change', e => {
      params.scanlines = e.target.checked;
    });
    document.getElementById('vignetteCheck').addEventListener('change', e => {
      params.vignette = e.target.checked;
    });
    document.getElementById('bloomCheck').addEventListener('change', e => {
      params.bloom = e.target.checked;
    });
    document.getElementById('btnPauseAnim').addEventListener('click', e => {
      params.animated = !params.animated;
      e.target.textContent = params.animated ? 'Pause Animation' : 'Resume Animation';
    });
    document.getElementById('btnExactJSON').addEventListener('click', () => {
      params.cellSize = 9;
      params.contrast = 158;
      params.density = 20;
      params.renderMode = 'dither';
      params.animIntensity = 60;
      params.animSpeed = 100;
      document.getElementById('cellSizeRange').value = 9;
      document.getElementById('cellSizeVal').textContent = 9;
      document.getElementById('contrastRange').value = 158;
      document.getElementById('contrastVal').textContent = 158;
      document.getElementById('densityRange').value = 20;
      document.getElementById('densityVal').textContent = 20;
      document.getElementById('animIntensityRange').value = 60;
      document.getElementById('animIntensityVal').textContent = '60%';
      document.getElementById('animSpeedRange').value = 100;
      document.getElementById('animSpeedVal').textContent = '100%';
      document.getElementById('renderModeSelect').value = 'dither';
      updateSourceSampling();
    });
    document.getElementById('btnExport').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `electric_gaze_vansh_${params.renderMode}_${params.palette}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
